name: Auto-merge notes PRs

# Run only trusted default-branch workflow code. Never check out PR content.
on:
  pull_request_target:
    types: [opened, ready_for_review, synchronize, reopened]
    branches: [main]

permissions: {}

# Separate PRs must not cancel each other's pending runs.
concurrency:
  group: auto-merge-notes-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  merge:
    if: >-
      github.repository == 'luyunfeng/lemon-grove' &&
      github.event.repository.id == 1397982562 &&
      github.event.pull_request.base.repo.id == 1397982562 &&
      github.event.pull_request.head.repo.id == 1397982562 &&
      github.event.pull_request.user.login == 'luyunfeng' &&
      github.event.pull_request.user.id == 16836223 &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Merge the current eligible PR head
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          import json
          import os
          import re
          import time
          import urllib.error
          import urllib.request
          
          REPOSITORY = "luyunfeng/lemon-grove"
          REPOSITORY_ID = 1397982562
          AUTHOR = "luyunfeng"
          AUTHOR_ID = 16836223
          API = "https://api.github.com"
          QUERY = """
          query($number: Int!) {
            repository(owner: "luyunfeng", name: "lemon-grove") {
              databaseId
              nameWithOwner
              pullRequest(number: $number) {
                number state isDraft merged baseRefName headRefOid mergeable
                author { login ... on User { databaseId } }
                repository { databaseId nameWithOwner }
                headRepository { databaseId nameWithOwner }
              }
            }
          }
          """
          
          
          def request(method, path, payload):
              # URLs, query and method are fixed here; PR text is never evaluated.
              req = urllib.request.Request(
                  API + path,
                  data=json.dumps(payload).encode("utf-8"),
                  method=method,
                  headers={
                      "Authorization": "Bearer " + os.environ["GH_TOKEN"],
                      "Accept": "application/vnd.github+json",
                      "Content-Type": "application/json",
                      "X-GitHub-Api-Version": "2026-03-10",
                      "User-Agent": "lemon-grove-native-auto-merge",
                  },
              )
              with urllib.request.urlopen(req, timeout=20) as response:
                  return json.load(response)
          
          
          def allowed(pr):
              def own_repo(repo):
                  return bool(repo) and repo.get("databaseId") == REPOSITORY_ID and repo.get("nameWithOwner") == REPOSITORY
          
              author = pr.get("author") or {}
              return (
                  pr.get("state") == "OPEN"
                  and pr.get("isDraft") is False
                  and pr.get("baseRefName") == "main"
                  and author.get("login") == AUTHOR
                  and author.get("databaseId") == AUTHOR_ID
                  and own_repo(pr.get("repository"))
                  and own_repo(pr.get("headRepository"))
              )
          
          
          def main(request_fn=request, sleep=time.sleep, attempts=20):
              if os.environ.get("GITHUB_REPOSITORY") != REPOSITORY:
                  raise RuntimeError("Unexpected repository; no merge attempted.")
              number_text = os.environ.get("PR_NUMBER", "")
              if not re.fullmatch(r"[1-9][0-9]*", number_text):
                  raise RuntimeError("Invalid PR number; no merge attempted.")
              number = int(number_text)
              deadline = time.monotonic() + 240
              for attempt in range(attempts):
                  if attempt:
                      sleep(5)
                  if time.monotonic() >= deadline:
                      break
                  try:
                      result = request_fn("POST", "/graphql", {"query": QUERY, "variables": {"number": number}})
                      if result.get("errors"):
                          raise RuntimeError("GitHub metadata query failed; no merge attempted.")
                      repo = result.get("data", {}).get("repository") or {}
                      if repo.get("databaseId") != REPOSITORY_ID or repo.get("nameWithOwner") != REPOSITORY:
                          raise RuntimeError("Repository identity did not match; no merge attempted.")
                      pr = repo.get("pullRequest") or {}
                      if pr.get("number") != number:
                          raise RuntimeError("PR identity did not match; no merge attempted.")
                      if pr.get("merged") is True:
                          print(f"PR #{number} is already merged.")
                          return
                      if not allowed(pr):
                          print(f"PR #{number} is outside the allowed scope; skipped.")
                          return
                      mergeable = pr.get("mergeable")
                      if mergeable == "CONFLICTING":
                          raise RuntimeError(f"PR #{number} has a merge conflict; resolve it manually.")
                      if mergeable == "UNKNOWN":
                          print(f"PR #{number}: GitHub is calculating mergeability; retrying.")
                          continue
                      if mergeable != "MERGEABLE":
                          raise RuntimeError("Unexpected mergeability state; no merge attempted.")
                      sha = pr.get("headRefOid", "")
                      if not re.fullmatch(r"[0-9a-f]{40}", sha):
                          raise RuntimeError("Invalid head SHA; no merge attempted.")
                      merged = request_fn(
                          "PUT", f"/repos/{REPOSITORY}/pulls/{number}/merge",
                          {"sha": sha, "merge_method": "merge"},
                      )
                      if merged.get("merged") is True:
                          print(f"Merged PR #{number} at head {sha}.")
                          return
                      raise RuntimeError("GitHub did not confirm the merge; inspect the PR before retrying.")
                  except urllib.error.HTTPError as error:
                      # 405 can be a race with another merge; 409 is a changed head SHA.
                      # Always re-read and revalidate metadata before another merge call.
                      if error.code in (405, 409, 429) or 500 <= error.code < 600:
                          print(f"PR #{number}: HTTP {error.code}; rechecking metadata before retry.")
                          continue
                      raise RuntimeError(f"GitHub returned HTTP {error.code}; no permission or protection bypass attempted.") from None
                  except (urllib.error.URLError, TimeoutError):
                      # A timed-out merge may have succeeded: the next metadata read checks it.
                      print(f"PR #{number}: temporary network failure; rechecking metadata.")
              raise RuntimeError(f"PR #{number} could not be merged within the retry window. Check Actions and rerun after resolving the blocker.")
          
          
          if __name__ == "__main__":
              try:
                  main()
              except RuntimeError as error:
                  print(f"::error::{error}")
                  raise SystemExit(1)
